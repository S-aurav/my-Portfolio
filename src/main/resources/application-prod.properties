# ==================================================
# PROD profile — activated on Render via SPRING_PROFILES_ACTIVE=prod
# ==================================================

# PostgreSQL (Render injects DATABASE_URL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 console disabled in prod
spring.h2.console.enabled=false

# Logging
logging.level.com.saurav=INFO
logging.level.org.springframework.security=WARN

# Storage Provider (default to cloudinary in production)
storage.provider=${STORAGE_PROVIDER:cloudinary}

# Cloudinary credentials will be loaded from environment variables:
# CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET

# Force mandatory production configuration variables (no fallbacks)
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
jwt.secret=${JWT_SECRET}

# ==================================================
# SERVERLESS DB OPTIMIZATIONS (Neon)
# ==================================================
# Allow the connection pool to scale down to 0 when idle so Neon can spin down to zero
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=900000

# Disable database health check in Actuator to prevent platform health checks (like Render's)
# from querying the DB and keeping it awake.
management.health.db.enabled=false

